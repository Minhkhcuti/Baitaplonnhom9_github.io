<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<section class="auth-page">

    <div class="container">

        <div class="auth-box mx-auto shadow">

            <h2 class="text-center mb-4">
                Login
            </h2>

            <form id="login-form">

                <div class="form-group">

                    <label>Email</label>

                    <input type="email"
                        class="form-control"
                        id="login-email">

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input type="password"
                        class="form-control"
                        id="login-password">

                </div>

                <button class="btn btn-dark btn-block">

                    Login

                </button>

            </form>

            <p class="text-center mt-3">

                Don't have account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </div>

</section>

<script src="js/auth.js"></script>

</body>
</html>
