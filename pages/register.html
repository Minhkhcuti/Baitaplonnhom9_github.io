<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký | Cosmetic Shop</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand font-weight-bold" href="../index.html"
          >Cosmetic Shop</a
        >
      </div>
    </nav>

    <section class="auth-page">
      <div class="container">
        <div class="auth-box mx-auto shadow">
          <div class="text-center mb-4">
            <i
              class="fa-solid fa-user-plus"
              style="font-size: 48px; color: #ff4d6d"
            ></i>
            <h4 class="mt-2 font-weight-bold">Tạo tài khoản</h4>
          </div>

          <form id="register-form">
            <div class="form-group">
              <label>Họ và tên</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text"
                    ><i class="fa-solid fa-user"></i
                  ></span>
                </div>
                <input
                  type="text"
                  class="form-control"
                  id="register-name"
                  placeholder="Nguyễn Văn A"
                />
              </div>
            </div>
            <div class="form-group">
              <label>Email</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text"
                    ><i class="fa-solid fa-envelope"></i
                  ></span>
                </div>
                <input
                  type="email"
                  class="form-control"
                  id="register-email"
                  placeholder="abc@gmail.com"
                />
              </div>
            </div>
            <div class="form-group">
              <label
                >Mật khẩu
                <small class="text-muted">(ít nhất 6 ký tự)</small></label
              >
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text"
                    ><i class="fa-solid fa-lock"></i
                  ></span>
                </div>
                <input
                  type="password"
                  class="form-control"
                  id="register-password"
                  placeholder="••••••"
                />
              </div>
            </div>
            <button
              class="btn btn-dark btn-block mt-3"
              style="border-radius: 50px; padding: 10px"
            >
              <i class="fa-solid fa-user-plus mr-2"></i> Đăng ký
            </button>
          </form>

          <p class="text-center mt-4 mb-0" style="font-size: 14px">
            Đã có tài khoản?
            <a href="login.html" style="color: #ff4d6d; font-weight: 600"
              >Đăng nhập</a
            >
          </p>
        </div>
      </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
