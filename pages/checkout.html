<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán | Cosmetic Shop</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand font-weight-bold" href="../index.html">Cosmetic Shop</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="checkout-page">
    <div class="container">
        <h2 class="section-title text-center mb-5">
            <i class="fa-solid fa-credit-card mr-2" style="color:#ff4d6d;"></i> Thanh toán
        </h2>

        <div class="row">
            <div class="col-lg-7 mb-4">
                <div class="checkout-box">
                    <h5 class="font-weight-bold mb-4">
                        <i class="fa-solid fa-user mr-2" style="color:#ff4d6d;"></i> Thông tin giao hàng
                    </h5>

                    <form id="checkout-form">
                        <div class="form-group">
                            <label>Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="checkout-name" placeholder="Nguyễn Văn A">
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="checkout-email" placeholder="abc@gmail.com">
                            </div>
                            <div class="form-group col-md-6">
                                <label>Số điện thoại <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="checkout-phone" placeholder="0912345678">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Địa chỉ giao hàng <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="checkout-address" rows="3"
                                      placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành phố"></textarea>
                        </div>
                        <button class="btn btn-dark btn-block mt-3" id="place-order-btn"
                                style="border-radius:50px; padding:12px; font-size:16px; font-weight:600;">
                            <i class="fa-solid fa-bag-shopping mr-2"></i> Đặt hàng ngay
                        </button>
                    </form>
                </div>
            </div>

            
            <div class="col-lg-5">
                <div class="checkout-summary">
                    <h4><i class="fa-solid fa-receipt mr-2"></i> Đơn hàng của bạn</h4>
                    <hr>
                    <div id="checkout-items"></div>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center">
                        <span style="font-size:16px;">Tổng cộng:</span>
                        <span id="checkout-total" style="font-size:22px; font-weight:700;">0 ₫</span>
                    </div>
                    <p class="mt-3 mb-0" style="font-size:12px; opacity:0.8;">
                        <i class="fa-solid fa-shield-halved mr-1"></i> Thanh toán an toàn &amp; bảo mật
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/checkout.js"></script>
</body>
</html>
