<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Cosmetic Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="admin-header">
    <div>
        <h4><i class="fa-solid fa-store mr-2"></i> Admin Dashboard</h4>
        <div style="font-size:14px; opacity:0.8; margin-top:4px;" id="adminWelcome"></div>
    </div>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
    </button>
</div>

<div class="container py-5">
    <div class="row mb-5">
        <div class="col-6 col-md-3 mb-3">
            <div class="stat-card">
                <div class="stat-num" id="statProducts">0</div>
                <div class="stat-label">Sản phẩm</div>
            </div>
        </div>
        <div class="col-6 col-md-3 mb-3">
            <div class="stat-card">
                <div class="stat-num" id="statOrders">0</div>
                <div class="stat-label">Đơn hàng</div>
            </div>
        </div>
        <div class="col-6 col-md-3 mb-3">
            <div class="stat-card">
                <div class="stat-num" id="statUsers">0</div>
                <div class="stat-label">Người dùng</div>
            </div>
        </div>
        <div class="col-6 col-md-3 mb-3">
            <div class="stat-card">
                <div class="stat-num" id="statRevenue">0</div>
                <div class="stat-label">Doanh thu (₫)</div>
            </div>
        </div>
    </div>
    <h5 class="font-weight-bold mb-4">Quản lý</h5>
    <div class="row">
        <div class="col-md-6 mb-4">
            <a href="manage-products.html" class="menu-card">
                <i class="fa-solid fa-boxes-stacked"></i>
                <h5>Quản lý sản phẩm</h5>
                <p>Thêm, sửa, xóa sản phẩm trong cửa hàng</p>
            </a>
        </div>
        <div class="col-md-6 mb-4">
            <a href="manage-orders.html" class="menu-card">
                <i class="fa-solid fa-bag-shopping"></i>
                <h5>Quản lý đơn hàng</h5>
                <p>Xem và cập nhật trạng thái đơn hàng</p>
            </a>
        </div>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/admin.js"></script>
<script>
(function () {
    const user = JSON.parse(localStorage.getItem("currentUser"));
    if (user) document.getElementById("adminWelcome").innerText = "Xin chào, " + user.name;

    const prods   = JSON.parse(localStorage.getItem("products")) || [];
    const orders  = JSON.parse(localStorage.getItem("orders"))   || [];
    const users   = JSON.parse(localStorage.getItem("users"))    || [];
    const revenue = orders.reduce((s, o) => s + (o.total || 0), 0);

    document.getElementById("statProducts").innerText = prods.length;
    document.getElementById("statOrders").innerText   = orders.length;
    document.getElementById("statUsers").innerText    = users.filter(u => u.role !== "admin").length;
    document.getElementById("statRevenue").innerText  = revenue.toLocaleString("vi-VN");
})();
</script>
</body>
</html>
